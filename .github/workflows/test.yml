name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s tests -v
      - run: python3 -m compileall -q ninetales_wallpapers install.py uninstall.py scripts
      - run: bash -n install-renderer.sh scripts/publish.sh
      - run: python3 scripts/build-release.py
  gui:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install GUI test dependencies
        run: sudo apt-get update && sudo apt-get --yes --no-install-recommends install python3-gi gir1.2-gtk-3.0 xvfb dbus-x11
      - name: Settings and language smoke test
        run: dbus-run-session -- /usr/bin/python3 scripts/test-gui.py
